    <style>
        /* 全局样式与白蓝色调背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f0f8ff; /* 极浅的蓝色背景 (AliceBlue) */
            color: #333;
            line-height: 1.6;
        }

        /* 1. 导航栏样式 */
        nav {
            background-color: #ffffff;
            box-shadow: 0 2px 10px rgba(0, 82, 164, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 70px;
            position: sticky; /* 滚动时导航栏固定在顶部 */
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            color: #0056b3;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }
        .nav-links a {
            color: #333;
            text-decoration: none;
            margin-left: 30px;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #007bff;
        }

        /* 2. 轮播图样式 */
        .carousel {
            position: relative;
            max-width: 900px;
            margin: 30px auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 82, 164, 0.1);
        }
        .carousel-inner {
            display: flex;
            transition: transform 0.5s ease-in-out;
            animation: slide 8s infinite; /* 自动播放间隔 */
        }
        .carousel-item {
            min-width: 100%;
            height: 350px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .item-1 { background-image: linear-gradient(rgba(255, 6, 6, 0.7), rgba(148, 3, 3, 0.986)), url('fukan.jpg'); background-color: #ff0909; }
        .item-2 { background-image: linear-gradient(rgba(255, 6, 6, 0.7), rgba(148, 3, 3, 0.986)), url('fukan2.jpg'); background-color: #ff8800; }
        .item-3 { background-image: linear-gradient(rgba(255, 6, 6, 0.7), rgba(148, 3, 3, 0.986)), url('你的图片3地址.jpg'); background-color: #ff0707; }

        /* 轮播图动画关键帧 */
        @keyframes slide {
            0%, 28% { transform: translateX(0); }
            33%, 61% { transform: translateX(-100%); }
            66%, 94% { transform: translateX(-200%); }
            100% { transform: translateX(0); }
        }

        /* 内容区域样式 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }
        .content-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 82, 164, 0.08);
            margin-bottom: 30px;
        }
        h2 {
            color: #007bff;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }
        p {
            color: #555;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        a.btn {
            display: inline-block;
            color: #ffffff;
            background-color: #007bff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }
        a.btn:hover {
            background-color: #0056b3;
        }

        /* 底部版权信息 */

            padding: 20px;
            color: #888;
            font-size: 0.9rem;
            border-top: 1px solid #e0e0e0;
            margin-top: 20px;
        }
    </style>
</head>
