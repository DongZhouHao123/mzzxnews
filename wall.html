<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校趣事 - 民族中学新闻网</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f0f8ff; /* 极浅的蓝色背景 */
            color: #333;
            line-height: 1.6;
        }

        /* 导航栏样式  */
        nav {
            background-color: #ffffff;
            box-shadow: 0 2px 10px rgba(0, 82, 164, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            height: 70px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-logo {
            color: #0056b3;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }
        .nav-links a {
            color: #333;
            text-decoration: none;
            margin-left: 30px;
            font-size: 1rem;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: #007bff; }

        /* 简介页面样式 */
        .intro-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }
        .intro-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 82, 164, 0.08);
            margin-bottom: 30px;
        }
        h1 {
            color: #0056b3;
            font-size: 2rem;
            margin-bottom: 20px;
            border-left: 5px solid #007bff;
            padding-left: 15px;
        }
        h2 {
            color: #007bff;
            margin: 25px 0 15px;
            font-size: 1.4rem;
        }
        p {
            color: #555;
            margin-bottom: 15px;
            font-size: 1rem;
            text-indent: 2em; 
        }

        /* 返回按钮 */
        a.back-btn {
            display: inline-block;
            color: #ffffff;
            background-color: #007bff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }
        a.back-btn:hover { background-color: #0056b3; }

        /* 版权 */
        footer {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 0.9rem;
            border-top: 1px solid #e0e0e0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <a href=" " class="nav-logo">民族中学新闻网</a >
        <div class="nav-links">
            <a href="index.html">首页</a >
            <a href="jianjie.html">学校简介</a >
            <a href=" https://v.douyin.com/2gelpXB0w8s/ 8@3.com :4pm">学校抖音</a >
            <a href="dongzhouhao.html">网站简介（必看）</a >
        </div>
    </nav>

    <!-- 内容 -->
    <div class="intro-container">
        <div class="intro-card">
            <h1>寻人墙（学生投稿）</h1>
            <p></p>
            <h1>每周趣事</h1>
        </div>
        <!-- 1. 评论展示区 -->
<div id="comments-container" style="margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px;">
  <h3>用户评论</h3>
  <div id="comments-list">加载中...</div>
</div>

<!-- 2. 您之前的评论表单（保持不变） -->
<form name="comments" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="comments" />
  <div style="display: none;">
    <label>Don't fill this out if you're human: <input name="bot-field" /></label>
  </div>
  <div style="margin-bottom: 10px;">
    <label for="name">昵称：</label><br>
    <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="请输入您的昵称">
  </div>
  <div style="margin-bottom: 10px;">
    <label for="message">评论内容：</label><br>
    <textarea id="message" name="message" rows="4" required style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="写下您的评论..."></textarea>
  </div>
  <button type="submit" style="padding: 10px 20px; cursor: pointer;">提交评论</button>
</form>

<!-- 3. 渲染评论的 JavaScript -->
<script>
  async function loadComments() {
    try {
      const response = await fetch('/.netlify/functions/get-comments');
      if (!response.ok) throw new Error('Failed to load comments');
      const comments = await response.json();

      const container = document.getElementById('comments-list');
      if (comments.length === 0) {
        container.innerHTML = '<p>暂无评论，快来抢沙发吧！</p>';
        return;
      }

      container.innerHTML = comments.map(c => `
        <div style="border-bottom: 1px solid #eee; padding: 10px 0;">
          <strong>${c.name}</strong> <span style="color: #888; font-size: 0.8em;">${new Date(c.created_at).toLocaleString()}</span>
          <p style="margin: 5px 0 0;">${c.message}</p>
        </div>
      `).join('');
    } catch (error) {
      document.getElementById('comments-list').innerHTML = '<p>评论加载失败</p>';
    }
  }

  // 页面加载时获取评论
  window.onload = loadComments;
</script>
    </div>

    <footer>
        <p>&copy; 网站编辑人 版权所有 | 内容由管理员修改 此网站非官方网站，请仔细辨别</p >
    </footer>

</body>
</html>
